%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters. Adjust them!
#--------------------------------------------------------------------------------------------
Camera.type: "PinHole"

# Camera calibration and distortion parameters (OpenCV)
Camera.fx: 639.0394208742191
Camera.fy: 638.9031569019952
Camera.cx: 325.57927556103937
Camera.cy: 250.09594798573525

Camera.k1: 0.3677981048277441
Camera.k2: 0.19305172321073713
Camera.p1: 0.0
Camera.p2: 0.0

Camera.width: 640
Camera.height: 480

# Camera frames per second 
Camera.fps: 15.0

# Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)
Camera.RGB: 1

# Image scale, it changes the image size to be processed (<1.0: reduce, >1.0: increase)
Camera.imageScale: 1.0

#Correção de rolling shutter:


# Transformation from camera to body-frame (imu)
Tbc: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [-0.99768786,  0.01665999, -0.06588913, -0.05255067,
          -0.06605944, -0.00988728,  0.99776670,  0.02153796,
           0.01597132,  0.99981233,  0.01096497, -0.02680729,
           0.00000000,  0.00000000,  0.00000000,  1.00000000]
           

# IMU noise
IMU.NoiseGyro: 1.7e-3
IMU.NoiseAcc: 2.0e-2
IMU.GyroWalk: 1.0e-5
IMU.AccWalk: 1.0e-4
IMU.Frequency: 200

IMU.InitBiasGyroX: -0.0447
IMU.InitBiasGyroY: 0.0266
IMU.InitBiasGyroZ: 0.0245

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------

# ORB Extractor: Number of features per image
ORBextractor.nFeatures: 2500

# ORB Extractor: Scale factor between levels in the scale pyramid 	
ORBextractor.scaleFactor: 1.2

# ORB Extractor: Number of levels in the scale pyramid	
ORBextractor.nLevels: 8

# ORB Extractor: Fast threshold
# Image is divided in a grid. At each cell FAST are extracted imposing a minimum response.
# Firstly we impose iniThFAST. If no corners are detected we impose a lower value minThFAST
# You can lower these values if your images have low contrast			
ORBextractor.iniThFAST: 12
ORBextractor.minThFAST: 5

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1
Viewer.GraphLineWidth: 0.9
Viewer.PointSize:2
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3
Viewer.ViewpointX: 0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500

